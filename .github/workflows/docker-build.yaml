name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - chaoskube
    paths-ignore:
      - 'k8s/helm/numbers-sense/values.yaml'  # Prevent loops from tag updates

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write to update Helm values
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values with new image tag
        if: github.ref == 'refs/heads/chaoskube'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "Updating image tag to: $SHORT_SHA"
          sed -i "s/^  tag: .*/  tag: \"$SHORT_SHA\"/" k8s/helm/numbers-sense/values.yaml
          cat k8s/helm/numbers-sense/values.yaml | grep -A2 "^image:"

      - name: Commit and push updated tag
        if: github.ref == 'refs/heads/chaoskube'
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/numbers-sense/values.yaml
          git diff --cached --quiet || git commit -m "chore: update image tag to $SHORT_SHA [skip ci]"
          git push
