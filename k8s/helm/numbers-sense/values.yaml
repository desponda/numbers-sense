replicaCount: 1

image:
  repository: ghcr.io/desponda/numbers-sense
  pullPolicy: Always
  tag: "5c166c4"

imagePullSecrets: []  # No secrets needed - image is public
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: cloudflare-tunnel
  annotations: {}
  hosts:
    - host: numbers-sense.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []  # Cloudflare handles SSL termination

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
