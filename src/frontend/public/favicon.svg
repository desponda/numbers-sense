<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#FDF8F3"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#4ECDC4" stroke-width="2"/>
  
  <!-- Stylized base-10 blocks arrangement -->
  <!-- Ten rod (vertical bar) -->
  <rect x="8" y="6" width="5" height="20" rx="1" fill="#4ECDC4"/>
  <!-- Segment lines on ten rod -->
  <line x1="8" y1="8" x2="13" y2="8" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="10" x2="13" y2="10" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="12" x2="13" y2="12" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="14" x2="13" y2="14" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="16" x2="13" y2="16" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="18" x2="13" y2="18" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="20" x2="13" y2="20" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="22" x2="13" y2="22" stroke="#3BB5AD" stroke-width="0.5"/>
  <line x1="8" y1="24" x2="13" y2="24" stroke="#3BB5AD" stroke-width="0.5"/>
  
  <!-- Unit cubes (3 stacked) -->
  <rect x="16" y="18" width="5" height="5" rx="1" fill="#4ECDC4"/>
  <rect x="16" y="12" width="5" height="5" rx="1" fill="#4ECDC4"/>
  <rect x="16" y="6" width="5" height="5" rx="1" fill="#4ECDC4"/>
  
  <!-- Plus sign to indicate building/adding -->
  <text x="23" y="22" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF6B6B">+</text>
</svg>
